# Weekly self-test of the live site: the browser test including real playback from the Internet Archive, a check of
# every page and every chapter's audio file, and a staleness check that starts the monthly book job if no book was
# published for 40 days while the queue still has books (GitHub sometimes skips scheduled runs). Never changes the site.
# On failure it opens (or updates) one issue labelled "site-health"; on recovery it closes it.
name: Weekly self-test

on:
  schedule:
    - cron: "47 10 * * 2"    # Tuesdays 10:47 UTC
    - cron: "19 */2 22,23 11 *"   # TEMPORARY: proves the schedule trigger on 22-23 Nov; remove once a scheduled run has passed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  GH_TOKEN: ${{ github.token }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tests on main
        run: npm test
      - name: Browser self-test against the live site (with real playback)
        run: node scripts/selftest.mjs "$SITE_URL/" 2>&1 | tee selftest.txt; exit ${PIPESTATUS[0]}
      - name: Every page, file and audio file
        if: always()
        run: node scripts/linkcheck.mjs "$SITE_URL" 2>&1 | tee linkcheck.txt; exit ${PIPESTATUS[0]}
      - name: Start the monthly book job if it hasn't published for 40 days
        if: always()
        run: |
          last=$(python3 -c "import json,glob; d=[json.load(open(f))['made'] for f in glob.glob('data/books/*/book.json')]; print(max(d) if d else '2000-01-01')")
          todo=$(python3 -c "import json,os; q=json.load(open('data/queue.json'))['books']; print(sum(1 for b in q if not b.get('skip') and not os.path.exists('data/books/%s/book.json' % b['slug'])))")
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "last book made $last ($age days ago); $todo books queued"
          if [ "$age" -gt 40 ] && [ "$todo" -gt 0 ]; then
            echo "::warning::No new book for $age days; starting the monthly book job."
            gh workflow run align.yml --ref main
          fi
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-selftest-${{ github.run_number }}
          path: selftest-out
          retention-days: 14
      - name: Open or update the health issue
        if: failure()
        run: |
          gh label create site-health --color B60205 --description "Automated live-site check failing" 2>/dev/null || true
          body="$(printf 'The weekly check found problems on %s (run %s/%s/actions/runs/%s):\n\n```\n%s\n%s\n```\nThe last good deploy is still live; this issue closes itself when the check passes again.' "$SITE_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -25 selftest.txt 2>/dev/null)" "$(tail -15 linkcheck.txt 2>/dev/null)")"
          num=$(gh issue list --label site-health --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "Live site self-test failing" --label site-health --body "$body"; fi
      - name: Close the health issue after recovery
        if: success()
        run: |
          for n in $(gh issue list --label site-health --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Self-test passing again (run $GITHUB_RUN_ID)."
          done

  keepalive:
    if: always() && github.event_name == 'schedule'
    needs: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/keepalive.sh
